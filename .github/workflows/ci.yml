name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: c10-control:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker run -d --name c10-ci -p 8787:8787 -e C10_HOST=127.0.0.1 c10-control:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/ | grep -q 'id="app"'
          curl -fsS http://127.0.0.1:8787/manifest.webmanifest | grep -q 'C10 Control'
          curl -fsS http://127.0.0.1:8787/icons/icon-192.png >/dev/null

      - name: Container logs
        if: failure()
        run: docker logs c10-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f c10-ci || true
